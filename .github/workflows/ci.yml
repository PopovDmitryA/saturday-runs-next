name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saturday_runs
          POSTGRES_PASSWORD: saturday_runs
          POSTGRES_DB: saturday_runs_lk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saturday_runs -d saturday_runs_lk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://saturday_runs:saturday_runs@localhost:5432/saturday_runs_lk
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: test-secret
      TELEGRAM_BOT_INTERNAL_SECRET: bot-secret
      TELEGRAM_BOT_USERNAME: TestBot
      APP_BASE_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Ruff
        run: ruff check app tests bot_app
      - name: Mypy
        continue-on-error: true
        run: mypy app bot_app
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
