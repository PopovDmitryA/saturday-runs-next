# Ротация логов контейнеров. Без неё json-file растёт бесконечно: beat и шесть
# воркеров пишут с --loglevel=info, наблюдатель протоколов — каждую минуту в
# субботу, а полный диск на проде кладёт PG на хосте (INFRA-05, 13.09.2026).
# 3 × 20 МБ на сервис; полностью хватает на разбор инцидента за пару суток.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saturday_runs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saturday_runs}
      POSTGRES_DB: ${POSTGRES_DB:-saturday_runs_lk}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    # Докер по умолчанию даёт контейнеру 64 МБ /dev/shm, а Postgres кладёт туда
    # сегменты параллельных хеш-джойнов (dynamic_shared_memory_type=posix). На
    # снимке прода (2.3 млн результатов) страница локации падала с
    # «could not resize shared memory segment … No space left on device»
    # (стенд 02.09.2026). На проде PG на хосте — там лимита нет.
    shm_size: "1g"
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saturday_runs} -d ${POSTGRES_DB:-saturday_runs_lk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    logging: *default-logging
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    # Do not publish by default; override only for local debugging if needed.
    ports:
      - "${REDIS_PUBLISH_PORT:-}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
      PM_WORLD_DSN: ${PM_WORLD_DSN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
      # Только для теста-сторожа аналитики: он читает список роутов прямо из
      # App.tsx, чтобы забыть внести новый раздел в классификатор было нельзя.
      # Read-only и на работу приложения не влияет.
      - ./frontend/src:/frontend-src:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # /health не ходит в базу — это проверка «процесс жив и отвечает», а не
    # готовность (для неё есть /health/ready). curl'а в python:slim нет,
    # поэтому urllib. На неё смотрит nginx (depends_on: service_healthy):
    # раньше он стартовал вместе с api и первые секунды отдавал 502.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    profiles: ["telegram"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: python -m bot_app.main
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
      tg-proxy:
        condition: service_started
    restart: unless-stopped

  tg-proxy:
    profiles: ["telegram"]
    image: ghcr.io/xtls/xray-core:latest
    volumes:
      - ./deploy/tg-proxy/config.json:/etc/xray/config.json:ro
    entrypoint: ["xray"]
    command: ["run", "-c", "/etc/xray/config.json"]
    logging: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
      # База обхода parkrun: тут крутится sweep_hq.refresh_snapshot (очередь по
      # умолчанию). С 13.09.2026 читается через Settings (pm_world_dsn), то есть
      # и из смонтированного .env; явная переменная оставлена, чтобы стенды с
      # PM_WORLD_DSN в окружении хоста работали как раньше.
      PM_WORLD_DSN: ${PM_WORLD_DSN:-}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    # Две очереди: дефолтная celery (наблюдатель протоколов раз в минуту,
    # прогрев главной, агрегаты, сводка, снимок /hq) и warm — прогревы кэша
    # рейтингов и локаций. Прогревы до 13.09.2026 жили на воркере runpark и
    # блокировались его синком (и наоборот); здесь concurrency=2, чтобы
    # минутные задачи не ждали многоминутный прогрев.
    command: celery -A app.workers.celery_app worker -Q celery,warm --concurrency=2 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-s95:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    # --prefetch-multiplier=1: с дефолтными 4 воркер заранее резервировал
    # задачи из s95_user, и список в Redis пустел ещё до их запуска — а батч
    # решает «уступить ли пользователю» по LLEN(s95_user) (s95/fetch/priority.py),
    # то есть не уступал никогда, и «обновить» ждало весь проход JSON-синка
    # (15–150 мин, SYNC-OTHER-02). С prefetch 1 задача пользователя лежит в
    # списке, пока батч не закончит или не уступит. -O fair — дефолт с Celery 4,
    # написан явно, чтобы было видно намерение: следующую задачу берёт
    # свободный процесс, а не тот, кто первый зарезервировал.
    command: celery -A app.workers.celery_app worker -Q s95_user,s95 --concurrency=1 --prefetch-multiplier=1 -O fair --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Две группы задач 5 вёрст на одном воркере, строго по приоритету:
  #   five_verst_fresh — свежесть: latest (сегодняшние протоколы) и точечная
  #                      перечитка локации по команде админа;
  #   five_verst       — фон: сверка истории, обход недели, ротация, реестр,
  #                      клубы, доборка протоколов из профилей.
  # Порядок в -Q и есть приоритет (queue_order_strategy: priority в
  # celery_app.py): фоновая задача берётся, только когда в five_verst_fresh
  # пусто. Второй воркер под свежесть не заводим намеренно — к 5verst.ru должен
  # ходить один запрос за раз.
  # --prefetch-multiplier=1 вместе с acks_late=True у фоновых задач не даёт
  # воркеру резервировать фоновую задачу «про запас»: пока он занят, очередь
  # никто не разбирает, и подоспевший latest берётся сразу после текущего куска.
  # Потолок ожидания = длина куска (~9 минут, см. five_verst_reconcile_batch_limit).
  # Пользовательская очередь — в отдельном воркере ниже: там человек ждёт ответа
  # у экрана, и ждать даже одного куска он не должен.
  worker-five-verst:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q five_verst_fresh,five_verst --concurrency=1 --prefetch-multiplier=1 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Только пользовательские синки 5 вёрст. Пока такой синк идёт, батч-воркер
  # стоит на паузе между фетчами (app/five_verst/fetch/priority.py), так что к
  # 5verst.ru по-прежнему ходит один запрос за раз — общий Redis-лок никуда не
  # делся, оба воркера берут его.
  worker-five-verst-user:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q five_verst_user --concurrency=1 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-parkrun:
    build:
      context: ./backend
      dockerfile: Dockerfile.parkrun
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
    # --max-tasks-per-child: в этом образе живёт Chromium (og_render, фетч
    # parkrun через Playwright), и процесс воркера со временем пухнет — раз в
    # сотню задач его дешевле пересоздать, чем ловить OOM.
    command: celery -A app.workers.celery_app worker -Q parkrun --concurrency=1 --max-tasks-per-child=100 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-runpark:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q runpark --concurrency=1 --max-tasks-per-child=1 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Прогревы кэша (рейтинги и страницы локаций). Отдельный воркер, потому что
  # эти задачи тяжёлые по базе и идут десятками минут: на очереди синка они
  # задерживали пользовательские «обновить», а после переезда воркеров на
  # домашний сервер ещё и считали агрегаты через WAN. Этот сервис остаётся там
  # же, где база.
  worker-warm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q warm --concurrency=1 --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app beat --loglevel=info
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # OG-картинки локаций: пишет celery-задача og_render (worker-parkrun),
      # nginx раздаёт как /og/locations/* (location ^~ /og/locations/).
      - ./data/og:/og-static/og:ro
      # Страницы обслуживания и флаг планового окна (deploy/nginx/maintenance_on).
      - ./deploy/nginx:/usr/share/nginx/maintenance:ro
    logging: *default-logging
    # Ждём здоровый api, а не просто запущенный: иначе первые секунды после
    # `up` nginx отдавал 502 на всё, включая smoke-проверку деплоя.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
