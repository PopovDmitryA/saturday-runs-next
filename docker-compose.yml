services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saturday_runs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saturday_runs}
      POSTGRES_DB: ${POSTGRES_DB:-saturday_runs_lk}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saturday_runs} -d ${POSTGRES_DB:-saturday_runs_lk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    # Do not publish by default; override only for local debugging if needed.
    ports:
      - "${REDIS_PUBLISH_PORT:-}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
      PM_WORLD_DSN: ${PM_WORLD_DSN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      DEBUG_AGENT_LOG_PATH: /cursor-debug/debug-31e6fc.log
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
      - ./.cursor:/cursor-debug
      # Только для теста-сторожа аналитики: он читает список роутов прямо из
      # App.tsx, чтобы забыть внести новый раздел в классификатор было нельзя.
      # Read-only и на работу приложения не влияет.
      - ./frontend/src:/frontend-src:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    profiles: ["telegram"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: python -m bot_app.main
    depends_on:
      api:
        condition: service_started
      tg-proxy:
        condition: service_started
    restart: unless-stopped

  tg-proxy:
    profiles: ["telegram"]
    image: ghcr.io/xtls/xray-core:latest
    volumes:
      - ./deploy/tg-proxy/config.json:/etc/xray/config.json:ro
    entrypoint: ["xray"]
    command: ["run", "-c", "/etc/xray/config.json"]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
      # База обхода parkrun: тут крутится sweep_hq.refresh_snapshot (очередь по
      # умолчанию). Читается через os.getenv, поля в Settings нет, поэтому
      # смонтированного .env недостаточно — переменную надо передать явно.
      PM_WORLD_DSN: ${PM_WORLD_DSN:-}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-s95:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q s95_user,s95 --concurrency=1 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Батчи 5 вёрст (сверка истории, ротация локаций, реестр). Идут часами,
  # поэтому пользовательская очередь вынесена в отдельный воркер ниже: внутри
  # одного процесса с concurrency=1 задачу не прервать, и «обновить» в личном
  # кабинете ждало бы конца батча.
  worker-five-verst:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q five_verst --concurrency=1 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Только пользовательские синки 5 вёрст. Пока такой синк идёт, батч-воркер
  # стоит на паузе между фетчами (app/five_verst/fetch/priority.py), так что к
  # 5verst.ru по-прежнему ходит один запрос за раз — общий Redis-лок никуда не
  # делся, оба воркера берут его.
  worker-five-verst-user:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q five_verst_user --concurrency=1 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-parkrun:
    build:
      context: ./backend
      dockerfile: Dockerfile.parkrun
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q parkrun --concurrency=1 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-runpark:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app worker -Q runpark --concurrency=1 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD:-saturday_runs}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./.env:/app/.env:ro
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # OG-картинки локаций: пишет celery-задача og_render (worker-parkrun),
      # nginx раздаёт как /og/locations/* (location ^~ /og/locations/).
      - ./data/og:/og-static/og:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
