  <link rel="stylesheet" href="styles.css" />
  <style>
    @keyframes viewIn {
      from { transform: translateY(10px); }
      to { transform: none; }
    }
    #root { min-height: 100vh; }
    /* #still — snap all entrance animations to final state (verification + reduced-motion safety) */
    .still *, .still *::before, .still *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
    .still .line-path { stroke-dashoffset: 0 !important; }
    .still .area-path { opacity: 1 !important; }
  </style>
  <script>
    if (location.hash.indexOf("still") !== -1) {
      window.__SR_STILL = true;
      document.documentElement.classList.add("still");
    }
  </script>
</head>
