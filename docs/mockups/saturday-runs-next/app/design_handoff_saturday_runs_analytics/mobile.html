<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saturday Runs · Мобильная версия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      background:
        radial-gradient(120% 90% at 50% -10%, #20283a 0%, #0f141f 60%);
      color: #e8ecf5;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 16px 60px;
    }
    .head { text-align: center; max-width: 600px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
    .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7c8aa6; }
    h1 { font-family: "Geologica", sans-serif; font-weight: 800; font-size: clamp(1.45rem, 3.4vw, 2rem); letter-spacing: -0.02em; line-height: 1.22; margin: 14px 0 14px; max-width: 16ch; }
    h1 em { font-style: normal; color: #57c7e3; }
    .lead { color: #9fb0cc; line-height: 1.55; font-size: 0.95rem; margin: 0; }
    .frames { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .frame-label { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.08em; color: #8b9bb8; text-transform: uppercase; }
    .app-iframe { width: 100%; height: 100%; border: none; display: block; background: #f8fafc; }
    .device-screen { height: 100%; display: flex; flex-direction: column; }
    .sb-spacer { height: 52px; flex: 0 0 52px; background: transparent; }
    .hint { margin-top: 36px; color: #6f7d97; font-size: 0.82rem; text-align: center; max-width: 60ch; line-height: 1.5; }
    .hint a { color: #57c7e3; text-decoration: none; }
    #root { width: 100%; display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="head">
    <div class="eyebrow">Saturday Runs · адаптив</div>
    <h1>Один билд — <em>десктоп и телефон</em></h1>
    <p class="lead">Та же аналитика на ширине телефона: компактная шапка, нижняя навигация по разделам, графики и таблицы в одну колонку. Листайте и переключайте разделы прямо в макете.</p>
  </div>
  <div id="root"></div>
  <p class="hint">Это живое приложение в рамке телефона. Полная десктоп-версия — <a href="index.html">index.html</a>.</p>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel">
    function MobileShowcase() {
      const screen = (page) => (
        <div className="device-screen">
          <div className="sb-spacer"></div>
          <iframe className="app-iframe" src={"index.html#" + page} title={"Saturday Runs — " + page}></iframe>
        </div>
      );
      return (
        <div className="frames">
          <div className="frame-wrap">
            <span className="frame-label">Сообщество</span>
            <IOSDevice width={392} height={812}>{screen("community")}</IOSDevice>
          </div>
          <div className="frame-wrap">
            <span className="frame-label">Мой профиль</span>
            <IOSDevice width={392} height={812}>{screen("personal")}</IOSDevice>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<MobileShowcase />);
  </script>
</body>
</html>
