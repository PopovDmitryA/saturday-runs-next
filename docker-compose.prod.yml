# Production on server: host PostgreSQL, no published DB/Redis ports, LK nginx on 127.0.0.1:8080.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    profiles: ["dev-db"]

  redis:
    ports: []

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
    ports: []
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  bot:
    volumes:
      - ./.env:/app/.env:ro

  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  worker-s95:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  worker-five-verst:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  worker-parkrun:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  beat:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  nginx:
    ports: !reset
      - "127.0.0.1:8080:80"
