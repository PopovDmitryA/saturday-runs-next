# Production on server: host PostgreSQL, no published DB/Redis ports, LK nginx on 127.0.0.1:8080.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# depends_on у api и воркеров переопределяется целиком через `!override`
# (Compose ≥ 2.24.4): postgres на проде живёт на хосте, ждать надо только
# redis. До 13.09.2026 стоял `!reset` — он обнуляет атрибут, а мапу под ним
# Compose отбрасывает: в итоговом конфиге (`docker compose … config`) у api и
# воркеров depends_on не было вовсе, и после перезагрузки они стартовали
# наперегонки с redis.

services:
  postgres:
    profiles: ["dev-db"]

  redis:
    # Брокер общий с воркерами домашнего сервера, поэтому публикуем — но только
    # на адрес из REDIS_BIND (у нас это tailnet-адрес прода), не на 0.0.0.0.
    ports: !override
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Потолок на один запрос из веба. Холодный пересчёт главной укладывается
      # в ~2 минуты, так что 180s не мешает живым страницам, но не даёт одному
      # сорвавшемуся запросу держать слот пула часами (см. app/db/session.py).
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-180s}
    # !override обязателен: голый `ports: []` списки не затирает, а склеивает,
    # поэтому базовый "8000:8000" оставался и api висел на 0.0.0.0 мимо nginx
    # (проверено 17.09.2026 снаружи: http://<прод>:8000/health отдавал 200).
    ports: !override []
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  bot:
    profiles: ["telegram"]

  # Дефолтная очередь "celery": прогрев главной портала, агрегаты популярности
  # страниц, суточная сводка автообновления в Telegram (см. admin_telegram_notify.py).
  # Раньше сервис был выключен
  # профилем "dev-default-worker" — эти задачи beat исправно ставил в очередь,
  # но разбирать её на проде было некому: остальные воркеры слушают только свои
  # -Q. Итог: главная портала считалась холодной (~2 мин) прямо в запросе
  # пользователя, а «Популярность» в админке стояла пустой. 18.07.2026.
  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  worker-s95:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  worker-five-verst:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  # Свежесть 5 вёрст — свой воркер, чтобы latest не ждал фон (см.
  # docker-compose.yml, worker-five-verst-fresh). Живёт на домашнем сервере,
  # прод его гасит вместе с остальными домашними (HOME_SERVICES в
  # scripts/remote_deploy.sh), но описание нужно здесь: без него Compose не
  # соберёт проект вовсе.
  worker-five-verst-fresh:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  # Пользовательские синки 5 вёрст — отдельный воркер, чтобы «обновить» в ЛК
  # не ждало окончания батча (батч уходит на паузу, см. fetch/priority.py).
  worker-five-verst-user:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  worker-parkrun:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  worker-runpark:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy

  worker-warm:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset
      redis:
        condition: service_healthy

  beat:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !override
      redis:
        condition: service_healthy
