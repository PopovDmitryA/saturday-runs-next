limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;

# Docker embedded DNS — re-resolve api:8000 after container recreate (avoids stale IP → 502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Per-IP rate limit before requests hit FastAPI.
        limit_req zone=api_global burst=60 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location /health {
        set $api_health_upstream http://api:8000/health;
        proxy_pass $api_health_upstream;
    }

    # Hashed build assets must 404 when missing — SPA fallback here breaks the app
    # (browser executes index.html as JS after a stale cached index.html).
    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
