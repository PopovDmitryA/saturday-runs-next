# Настоящий адрес клиента. Прод: host-nginx (TLS) → этот nginx → api. Сюда все
# запросы приходят с одного адреса (docker-proxy / шлюз моста), и без realip
# $remote_addr у ВСЕХ посетителей одинаковый: зона limit_req ниже была одним
# общим ведром на весь сайт (30 r/s на всех, а не на IP), а приложение брало
# первый элемент X-Forwarded-For — то есть то, что клиент написал сам
# (найдено аудитом 13.09.2026). Доверяем только loopback и docker/приватным
# сетям; real_ip_recursive идёт по X-Forwarded-For справа налево и
# останавливается на первом чужом адресе — подставленный клиентом левый
# элемент так и остаётся мусором. После этого $remote_addr — настоящий
# клиент, и X-Real-IP, который мы шлём в api, можно считать правдой.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Лимиты на IP (после realip — на настоящий). Общее ведро /api: 30 r/s с
# запасом на всплеск — SPA за один экран делает несколько запросов, а за
# операторским NAT сидят десятки людей. Отдельное, строже, — на /api/auth/:
# запрос входа стоит дороже (Redis, письма, Telegram), а легитимный ритм там
# редкий (опрос статуса входа раз в 2 с).
limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;

# Пререндер для роботов. Сайт — SPA: на любой адрес nginx отдаёт один и тот же
# index.html, содержимое дорисовывает JS уже в браузере. Робот видит пустую
# болванку — ни заголовка, ни текста, ни og-тегов. Поэтому запросы роботов
# уводим на бэкенд (/__prerender), который собирает настоящий HTML.
# Человека это не касается: не совпал User-Agent — обычный SPA, как раньше.
map $http_user_agent $seo_prerender {
    default 0;

    # ВАЖНО: выигрывает ПЕРВОЕ совпавшее правило, поэтому исключения идут
    # раньше общих. YandexMetrika должна остаться на обычном SPA: этим агентом
    # ходят проверка «код счётчика установлен» и вебвизор, им нужен index.html
    # со сниппетом Метрики. В пререндере счётчика нет — проверка вечно
    # «не находила» бы код. Без этой строки её забирало бы правило-подстраховка.
    "~*yandexmetrika"                   0;

    # Поисковики (Яндекс важнее прочих: рендерить JS он умеет заметно хуже
    # Google, а трафик у нас русский).
    "~*yandex(bot|images)"              1;
    "~*googlebot|google-inspectiontool" 1;
    "~*bingbot|duckduckbot|baiduspider" 1;
    "~*applebot|petalbot"               1;

    # Разворачиватели ссылок в мессенджерах и соцсетях: JS не исполняют вообще.
    "~*telegrambot"                     1;
    "~*vkshare|vkrobot"                 1;
    "~*whatsapp"                        1;
    "~*facebookexternalhit|twitterbot"  1;
    "~*discordbot|slackbot|linkedinbot" 1;
    # Одноклассники разворачивают ссылки не реже ВК, а до 21.08.2026 получали
    # пустую болванку. Рядом — остальные площадки и движки-разворачиватели
    # (Embedly и Iframely подключают у себя многие сайты, форумы и вики).
    "~*odklbot|viber|skypeuripreview"   1;
    "~*redditbot|pinterest|mastodon"    1;
    "~*embedly|iframely|snapchat"       1;

    # Сервисы проверки превью. Нужны не им, а нам: без этого прогон страницы
    # через socialsharepreview.com или opengraph.xyz показывает пустую
    # болванку, и по такому отчёту невозможно судить о реальной разметке.
    "~*socialsharepreview|opengraph"    1;
    "~*metatags|w3c_validator|validator.nu" 1;
    "~*curl|wget|python-requests"       1;

    # Подстраховка для тех, кого не предвидели: новые мессенджеры, агрегаторы,
    # читалки. Стоит последней, поэтому исключения выше уже отработали.
    # Браузеры под неё не попадают — в их представлении нет этих слов.
    "~*(bot|crawler|spider|preview)"    1;
}

# Пререндерим только маршруты приложения, но не запросы файлов. Иначе робот,
# пришедший за реальным файлом в корне, получит вместо него HTML страницы —
# и первым же пострадает подтверждение прав на сайт в Яндекс.Вебмастере и
# Google Search Console: они кладут в корень yandex_<хэш>.html / google<хэш>.html
# и читают его СВОИМ агентом. Отдали бы им нашу разметку — «файл не найден».
map $uri $seo_prerender_route {
    default 1;
    "~\.[A-Za-z0-9]{1,8}$" 0;
}

# Docker embedded DNS — re-resolve api:8000 after container recreate (avoids stale IP → 502).
# Плановое окно обслуживания: пока на диске лежит deploy/nginx/maintenance_on,
# сайт целиком отдаёт страницу «Плановое обновление» (503). Флаг создаётся и
# убирается руками на проде, nginx перезапускать не нужно — проверка файла
# делается на каждый запрос.
#
# Исключения обязательны, иначе окно ломает сам деплой и внутреннюю кухню:
#   /health   — по нему smoke деплоя решает, поднялся ли прод;
#   /og/      — картинки превью ссылок, их дёргает Телеграм и соцсети;
#   /render/  — служебные страницы, которые снимает Playwright изнутри сети;
#   /__maint  — ссылка обхода для админа (см. ниже).
map $uri $maint_exempt {
    default   0;
    "~^/health" 1;
    "~^/og/"    1;
    "~^/render/" 1;
    "~^/__maint" 1;
}

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    # --- Плановое окно обслуживания -------------------------------------
    # Порядок важен: сначала поднимаем флаг по файлу, затем снимаем его для
    # исключений и для админа с кукой обхода, и только потом отвечаем 503.
    set $maint 0;
    if (-f /usr/share/nginx/maintenance/maintenance_on) {
        set $maint 1;
    }
    if ($maint_exempt) {
        set $maint 0;
    }
    if ($cookie_maint_bypass = "let-me-in") {
        set $maint 0;
    }
    if ($maint) {
        return 503;
    }

    # 503 намеренно сохраняется в ответе: поисковики понимают его как
    # «зайдите позже» и не выкидывают страницы из индекса, в отличие от 200
    # с текстом заглушки.
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/maintenance;
        try_files /maintenance_planned.html =503;
        add_header Retry-After 2400 always;
        add_header Cache-Control "no-store" always;
    }

    # Ссылка обхода для админа: ставит куку на два часа и возвращает на сайт.
    location = /__maint/bypass {
        # absolute_redirect off — иначе nginx собирает абсолютный адрес из $host
        # и теряет схему с портом: за TLS-слоем это давало бы http:// вместо https://.
        absolute_redirect off;
        add_header Set-Cookie "maint_bypass=let-me-in; Path=/; Max-Age=7200; SameSite=Lax" always;
        return 302 /;
    }
    location = /__maint/leave {
        absolute_redirect off;
        add_header Set-Cookie "maint_bypass=; Path=/; Max-Age=0" always;
        return 302 /;
    }
    # --------------------------------------------------------------------

    # Сжатие. Базовый образ nginx отдаёт gzip только для text/html (и то на
    # host-слое), поэтому бандл (~900 КБ) и JSON API ходили как есть.
    # gzip_proxied any — иначе ответы api:8000 (проксируемые) не жмутся.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/geo+json
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # ^~, а не простой префикс: иначе regex-локация со статикой ниже
    # (\.(png|jpg|…)$) перехватывает ответы API с расширением в пути —
    # /api/avatars/<файл>.jpg уходил в try_files по диску и отдавал 404 nginx.
    # Вход и OAuth — своё, более строгое ведро поверх общего. Отдельный
    # location, а не второй limit_req в /api/: у nginx выигрывает самый
    # длинный префикс, так что /api/auth/* сюда и попадает.
    # Админская загрузка треков: архив выгрузки из Garmin — это сотни .fit,
    # у постоянного бегуна за несколько лет легко 100+ МБ. Общий потолок в
    # 12m резал такой запрос ещё на nginx (413 на 14 МБ, 23.09.2026), причём
    # ответ приходил HTML-страницей nginx, а не ошибкой приложения.
    # 128m — это примерно потолок самой пачки: за раз разбирается не больше
    # MAX_FILES_PER_BATCH=2000 файлов, а .fit в архиве весит около 70 КБ.
    # Больше принимать смысла нет, а память бережёт: обработчик читает тело
    # целиком. Тот же потолок продублирован в MAX_ARCHIVE_BYTES
    # (app/services/admin_track_import_service.py) — менять надо в обоих местах.
    # Location отдельный и ^~, чтобы длинный префикс выиграл у /api/ и лимит
    # не распространялся на остальное API. Вход админа проверяет уже бэкенд.
    location ^~ /api/admin/track-imports {
        client_max_body_size 128m;
        limit_req zone=api_global burst=100 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location ^~ /api/auth/ {
        client_max_body_size 12m;
        limit_req zone=api_auth burst=30 nodelay;
        limit_req zone=api_global burst=100 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location ^~ /api/ {
        # Загрузка аватарок: дефолтный 1m резал multipart ещё на nginx (413).
        # Бэкенд сам ограничивает 10 МБ и сжимает до 256×256.
        client_max_body_size 12m;
        # Лимит на настоящий IP клиента (realip в начале файла), а не на
        # адрес host-nginx — до 13.09.2026 это было одно ведро на весь сайт.
        limit_req zone=api_global burst=100 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location /health {
        set $api_health_upstream http://api:8000/health;
        proxy_pass $api_health_upstream;
    }

    # sitemap.xml и robots.txt собирает бэкенд (список локаций живой, файлом
    # его не положишь). Отдельными location'ами — иначе их съест SPA-fallback.
    location = /sitemap.xml {
        set $api_sitemap_upstream http://api:8000/sitemap.xml;
        proxy_pass $api_sitemap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        set $api_robots_upstream http://api:8000/robots.txt;
        proxy_pass $api_robots_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Закладки со времён, когда Grafana жила на run5k.run (/d/…, /dashboard/…,
    # /public/…). Редиректа на grafana.run5k.run тут БОЛЬШЕ НЕТ: домен закрыт
    # заглушкой, а приложение само открывает нужную страницу сайта по uid
    # дашборда (LEGACY_DASHBOARD_ROUTES в frontend/src/lib/siteBrand.ts).
    # Такие же три location были в host-nginx (deploy/nginx/run5k.run.conf) —
    # убирать надо в ОБОИХ местах, иначе запрос до приложения не доходит.

    # Hashed build assets must 404 when missing — SPA fallback here breaks the app
    # (browser executes index.html as JS after a stale cached index.html).
    # ^~, а не просто префикс: иначе картинки/шрифты внутри /assets/ перехватит
    # regex-локация ниже и они потеряют immutable-кэш.
    location ^~ /assets/ {
        # Имя файла содержит хэш содержимого: новая сборка = новое имя, старое
        # можно держать в кэше вечно. Без этого браузер на каждый заход слал
        # условный запрос (If-None-Match) на ~1 МБ ассетов.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Прегенерированные OG-картинки локаций (Л19): их рисует celery-задача
    # og_render в ./data/og (том /og-static/og), а пререндер подставляет в
    # og:image с версией в query (?v=дата) — она и сбрасывает кэш Telegram.
    location ^~ /og/locations/ {
        root /og-static;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Карточки участников — та же папка, свой подкаталог.
    location ^~ /og/users/ {
        root /og-static;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Статика без хэша в имени (favicon, og-картинки, donate-qr): кэш на час,
    # но с ревалидацией — имя не меняется при обновлении файла.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Робот вместо пустой SPA-болванки получает собранный бэкендом HTML.
        # `if` здесь безопасен: это ровно тот случай, ради которого он и
        # оставлен в nginx — proxy_pass внутри if уводит запрос в отдельную
        # конфигурацию, минуя try_files ниже. Человек до if не доходит.
        # Условие склеено из двух переменных, потому что `if` в nginx не умеет
        # логическое И: "11" = это робот И это маршрут, а не файл.
        set $seo_prerender_hit "$seo_prerender$seo_prerender_route";
        if ($seo_prerender_hit = "11") {
            # Свой add_header внутри if нужен не только ради Vary: в nginx
            # add_header наследуется с уровня выше, только когда на текущем
            # уровне нет ни одного своего. Без этой строки к ответу пререндера
            # добавлялся no-store из location / — и робот получал ДВА
            # противоречащих Cache-Control (проверено curl'ом 13.09.2026).
            # Политику кэша задаёт бэкенд: public, max-age=600 на 200 и
            # no-store на 404 (routes/seo.py). А Vary здесь по делу: ответ на
            # один и тот же адрес зависит от User-Agent.
            add_header Vary User-Agent always;
            # $uri — без строки запроса; $is_args$args дописывает её, иначе
            # /updates?page=3 доезжал до бэкенда как /updates, и все страницы
            # истории релизов из sitemap рендерились роботам первой.
            proxy_pass http://api:8000/__prerender$uri$is_args$args;
        }

        try_files $uri $uri/ /index.html;
    }
}
