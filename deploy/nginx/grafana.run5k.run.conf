# Host nginx — legacy Grafana at https://grafana.run5k.run
# Install: /etc/nginx/sites-available/grafana.run5k.run
# Proxies to local Grafana (127.0.0.1:9000).

server {
    listen 80;
    listen [::]:80;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    # certbot --nginx -d grafana.run5k.run fills these on first deploy
    ssl_certificate /etc/letsencrypt/live/grafana.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = / {
        return 302 /d/ce5xtszxy4074e/glavnaja;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}

# WebSocket upgrade map — add once to /etc/nginx/nginx.conf http {} if missing:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
