# Host nginx — legacy Grafana at https://grafana.run5k.run
# Install: /etc/nginx/sites-available/grafana.run5k.run
# Proxies to local Grafana (127.0.0.1:9000).
#
# На время переезда дашбордов на run5k.run здесь же висит счётчик посещений:
# sub_filter вставляет /__count.js в HTML Grafana, скрипт стучится в
# /__count/hit, nginx пишет строку в /var/log/nginx/grafana_hits.log.
# Отчёт: scripts/grafana_usage_report.py. Ставится scripts/install_grafana_counter.sh.

# Табличный формат: время, IP, id браузера, путь, тип события, UA, реферер.
log_format grafana_hit '$time_iso8601\t$remote_addr\t$arg_v\t$arg_p\t$arg_t\t"$http_user_agent"\t"$http_referer"';

server {
    listen 80;
    listen [::]:80;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    # certbot --nginx -d grafana.run5k.run fills these on first deploy
    ssl_certificate /etc/letsencrypt/live/grafana.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # sub_filter умеет править только несжатый ответ, поэтому ниже у прокси
    # снят Accept-Encoding. Чтобы бандлы Grafana (мегабайты JS) не поехали к
    # клиенту в сыром виде, сжимаем их сами — в nginx.conf включён только gzip on,
    # без gzip_types, то есть по умолчанию жмётся один text/html.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml text/plain application/xml;

    location = / {
        return 302 /d/ce5xtszxy4074e/glavnaja;
    }

    # Счётчик: сам скрипт (файл кладёт scripts/install_grafana_counter.sh).
    location = /__count.js {
        alias /var/www/grafana-counter/count.js;
        default_type application/javascript;
        expires 10m;
        access_log off;
    }

    # Счётчик: приём события. Ответ пустой, вся ценность — строка в логе.
    location = /__count/hit {
        access_log /var/log/nginx/grafana_hits.log grafana_hit;
        add_header Cache-Control "no-store";
        return 204;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Вставка счётчика в HTML. sub_filter_types по умолчанию = text/html,
        # поэтому JSON API и бандлы не трогаются.
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/__count.js" defer></script></body>';
        sub_filter_once on;
    }
}

# WebSocket upgrade map — add once to /etc/nginx/nginx.conf http {} if missing:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
