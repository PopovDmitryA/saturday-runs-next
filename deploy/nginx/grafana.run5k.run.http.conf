# Bootstrap HTTP vhost for certbot (grafana.run5k.run).
# Replaced by grafana.run5k.run.conf after TLS is issued.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
