# Legacy subdomain — permanent redirect to https://run5k.run
# Install: /etc/nginx/sites-available/app.run5k.run

server {
    listen 80;
    server_name app.run5k.run;

    return 301 https://run5k.run$request_uri;
}

server {
    listen 443 ssl;
    server_name app.run5k.run;

    ssl_certificate /etc/letsencrypt/live/app.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://run5k.run$request_uri;
}
