# Host nginx — прощальная заглушка на месте legacy-Grafana (grafana.run5k.run).
# Install: /etc/nginx/sites-available/grafana.run5k.run
# Ставится scripts/install_grafana_farewell.sh (нужен sudo, снимок прежнего
# конфига кладётся рядом — им же и откатываться).
#
# Grafana больше НЕ проксируется: любой адрес отдаёт /var/www/grafana-farewell/
# index.html («дашборды переехали на run5k.run»). Сама Grafana остаётся жива на
# 127.0.0.1:9000 — доступна только с сервера/через ssh-туннель, данные не тронуты.
#
# Счётчик оставлен намеренно: /__count/hit продолжает писать в тот же лог, что и
# раньше, а заглушка сама шлёт туда событие t=farewell. Так видно, кто ещё
# ломится в старые адреса и в какие именно. Отчёт: scripts/grafana_usage_report.py.

# Табличный формат: время, IP, id браузера, путь, тип события, UA, реферер.
log_format grafana_hit '$time_iso8601\t$remote_addr\t$arg_v\t$arg_p\t$arg_t\t"$http_user_agent"\t"$http_referer"';

server {
    listen 80;
    listen [::]:80;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.run5k.run;

    access_log /var/log/nginx/grafana_run5k_access.log;
    error_log /var/log/nginx/grafana_run5k_error.log;

    # certbot --nginx -d grafana.run5k.run fills these on first deploy
    ssl_certificate /etc/letsencrypt/live/grafana.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/grafana-farewell;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript;

    # Приём события счётчика. Ответ пустой, вся ценность — строка в логе.
    location = /__count/hit {
        access_log /var/log/nginx/grafana_hits.log grafana_hit;
        add_header Cache-Control "no-store";
        return 204;
    }

    # У кого-то в кэше висит старая страница Grafana со <script src="/__count.js">
    # — пусть тихо получит пустоту вместо HTML-заглушки с MIME-ошибкой в консоли.
    location = /__count.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 204;
    }

    # Всё остальное — заглушка. Именно 200: старые ссылки должны открывать
    # человеческую страницу, а не браузерную ошибку.
    location / {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-store";
    }
}
