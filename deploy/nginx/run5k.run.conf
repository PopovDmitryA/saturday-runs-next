# Host nginx — main LK at https://run5k.run
# Install: /etc/nginx/sites-available/run5k.run
# Proxies to Docker stack (127.0.0.1:8080).

server {
    listen 80;
    listen [::]:80;
    server_name run5k.run www.run5k.run;

    access_log /var/log/nginx/run5k_access.json run5k_json;
    error_log /var/log/nginx/run5k_error.log;

    return 301 https://run5k.run$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.run5k.run;

    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://run5k.run$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name run5k.run;

    access_log /var/log/nginx/run5k_access.json run5k_json;
    error_log /var/log/nginx/run5k_error.log;

    # Протоколы TLS задаёт подключаемый ниже options-ssl-nginx.conf от certbot
    # (TLSv1.2 и TLSv1.3); дублировать их здесь — только ловить warn в nginx -t.
    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Не раскрывать версию nginx в Server и на страницах ошибок.
    server_tokens off;

    # Security-заголовки (INFRA-04, 13.09.2026). Ставятся здесь, на host-nginx:
    # он единственный, кто видит TLS и отвечает за весь домен, включая
    # заглушки 502/503 (поэтому always). Наследуются всеми location ниже — там
    # своих add_header нет и быть не должно (иначе nginx перестанет
    # наследовать эти).
    #   HSTS — год, без includeSubDomains: grafana.run5k.run живёт своей
    #   заглушкой и в нашу политику не входит; без preload — его не отозвать.
    #   SAMEORIGIN — кабинет и админку нельзя вставить в чужой iframe
    #   (кликджекинг); свои виджеты входа (Telegram, VK) — это МЫ вставляем
    #   их, на это заголовок не влияет.
    #   Referrer-Policy — на чужие сайты уходит только origin: в адресах бывают
    #   токены (/login?…, magic link).
    # ⚠️ Host-nginx деплоем не перезапускается — применить руками:
    #    cp deploy/nginx/run5k.run.conf /etc/nginx/sites-available/run5k.run && nginx -t && nginx -s reload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Заглушка, когда docker-стек (127.0.0.1:8080) недоступен. Host nginx живёт
    # вне Docker и деплоем не перезапускается, поэтому отдаёт страницу с диска.
    # По коду ошибки деплой от аварии не отличить (оба дают 502), различает
    # деплой-скрипт: scripts/remote_deploy.sh на время выкатки подкладывает
    # maintenance_current.html («Обновляемся») и убирает его по завершении.
    # Нет current → отдаётся дежурный maintenance_down.html («Что-то сломалось»).
    # Код ответа остаётся 502/503/504 — мониторинг видит проблему как раньше.
    error_page 502 503 504 /__maintenance;
    location = /__maintenance {
        internal;
        root /opt/saturday-runs-next/deploy/nginx;
        try_files /maintenance_current.html /maintenance_down.html =502;
    }

    # Закладки со времён, когда Grafana жила на run5k.run (/d/…, /dashboard/…,
    # /public/…). Раньше nginx отправлял их 301-м на grafana.run5k.run; теперь
    # тот домен закрыт заглушкой, поэтому редиректа тут НЕТ — запрос идёт в
    # приложение, а оно само открывает нужную страницу сайта по uid дашборда
    # (LEGACY_DASHBOARD_ROUTES в frontend/src/lib/siteBrand.ts) или показывает
    # «старая статистика закрыта». Вернуть редирект = снова увести людей на
    # закрытый домен.

    # Служебные страницы рендера OG-картинок (Л19): их открывает только
    # Playwright внутри docker-сети (worker-parkrun → nginx), снаружи не нужны.
    # ⚠️ Host-nginx деплоем не перезапускается — применить руками:
    #    cp deploy/nginx/run5k.run.conf /etc/nginx/sites-available/run5k.run && nginx -s reload
    location ^~ /render/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
