# Host nginx — main LK at https://run5k.run
# Install: /etc/nginx/sites-available/run5k.run
# Proxies to Docker stack (127.0.0.1:8080).

server {
    listen 80;
    listen [::]:80;
    server_name run5k.run www.run5k.run;

    access_log /var/log/nginx/run5k_access.json run5k_json;
    error_log /var/log/nginx/run5k_error.log;

    return 301 https://run5k.run$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.run5k.run;

    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://run5k.run$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name run5k.run;

    access_log /var/log/nginx/run5k_access.json run5k_json;
    error_log /var/log/nginx/run5k_error.log;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
