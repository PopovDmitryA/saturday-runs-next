<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Автообновление: как только сайт поднимется, перезагрузка вернёт приложение -->
<meta http-equiv="refresh" content="10">
<title>run5k.run — что-то сломалось</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --accent: #6366f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120;
      --surface: #101830;
      --border: #24304d;
      --text: #e2e8f0;
      --text-muted: #8b9bb8;
      --accent: #818cf8;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }
  .brand .tld { color: var(--accent); }
  .tagline {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }
  /* пульс оборван на середине — сайт прилёг */
  .pulse {
    width: 72px;
    height: 28px;
    margin: 0 auto 24px;
    display: block;
    stroke: var(--accent);
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pulse circle { fill: var(--accent); stroke: none; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 14.5px; line-height: 1.55; color: var(--text-muted); }
  p + p { margin-top: 8px; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">run5k<span class="tld">.run</span></div>
    <div class="tagline">Статистика парковых пробежек</div>
    <svg class="pulse" viewBox="0 0 34 14" aria-hidden="true">
      <polyline points="1,12 8,10 14,11 20,6"></polyline>
      <circle cx="20" cy="6" r="2.4"></circle>
    </svg>
    <h1>Что-то сломалось</h1>
    <p>Сайт временно недоступен — такое бывает, скоро починим.</p>
    <p>Загляните в канал <a href="https://t.me/popov_way">@popov_way</a> — если о поломке
    уже известно, там будут новости.</p>
    <p>Или напишите автору: <a href="https://t.me/Popov_Dmitry">@Popov_Dmitry</a> —
    возможно, он ещё не знает.</p>
  </main>
</body>
</html>
