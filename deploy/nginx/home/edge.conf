# Край домашнего сервера: TLS, редиректы доменов, прокси в стек.
#
# Зеркалит то, что на VPS делал ХОСТОВЫЙ nginx (deploy/nginx/run5k.run.conf).
# Разница ровно одна: там он жил вне Docker и правился руками, здесь — контейнер
# `edge`, который поднимается тем же compose, что и всё остальное.
#
# Почему два nginx, а не один: контейнер `nginx` (nginx/conf.d/default.conf)
# несёт всю логику сайта — лимиты, gzip, статику, страницу обслуживания, прокси
# к api. Он на проде уже обкатан; лезть в него ради TLS значит рисковать
# работающим. Край занимается только шифрованием и доменами.

log_format run5k_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"host":"$host",'
      '"scheme":"$scheme",'
      '"request_method":"$request_method",'
      '"uri":"$uri",'
      '"args":"$args",'
      '"request":"$request",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

# HTTP: только редирект и проверка сертификата. Продление certbot ходит
# именно сюда, поэтому .well-known отдаём с диска, а не в редирект.
server {
    listen 80;
    server_name run5k.run www.run5k.run app.run5k.run grafana.run5k.run;
    access_log /var/log/nginx/run5k_access.json run5k_json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://run5k.run$request_uri;
    }
}

# www и app — исторические адреса, оба ведут на апекс.
server {
    listen 443 ssl;
    http2 on;
    server_name www.run5k.run;
    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;
    return 301 https://run5k.run$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name app.run5k.run;
    ssl_certificate /etc/letsencrypt/live/app.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.run5k.run/privkey.pem;
    return 301 https://run5k.run$request_uri;
}

# Прощальная страница закрытой Grafana. Домен живёт своей жизнью с 04.09.2026,
# и переезд для него ничего не меняет — те же файлы, тот же 200.
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.run5k.run;
    ssl_certificate /etc/letsencrypt/live/grafana.run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.run5k.run/privkey.pem;
    root /var/www/grafana-farewell;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name run5k.run;
    access_log /var/log/nginx/run5k_access.json run5k_json;

    # Не раскрывать версию nginx в Server и на страницах ошибок.
    server_tokens off;

    # Security-заголовки — те же, что у host-nginx на VPS (deploy/nginx/run5k.run.conf).
    # Ставятся на краю: он единственный видит TLS и отвечает за весь домен,
    # включая заглушку 502 (поэтому always). Наследуются всеми location ниже —
    # там своих add_header нет и быть не должно, иначе nginx перестанет
    # наследовать эти.
    #   HSTS — год, без includeSubDomains: grafana.run5k.run живёт своей
    #   заглушкой; без preload — его не отозвать.
    #   SAMEORIGIN — кабинет и админку нельзя вставить в чужой iframe.
    #   Referrer-Policy — на чужие сайты уходит только origin: в адресах
    #   бывают токены (magic link).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/run5k.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/run5k.run/privkey.pem;

    client_max_body_size 20m;

    # Стек не отвечает — отдаём страницу с диска, как это делал host-nginx.
    # Край перезапускается вместе со всеми, поэтому «Обновляемся» здесь не
    # покажешь: эту роль на себя берёт контейнер nginx (@maintenance внутри).
    error_page 502 503 504 /__maintenance;
    location = /__maintenance {
        internal;
        root /maintenance;
        try_files /maintenance_down.html =502;
    }

    # Служебные страницы рендера OG-картинок: их открывает только Playwright
    # внутри docker-сети, снаружи они не нужны.
    location ^~ /render/ {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
