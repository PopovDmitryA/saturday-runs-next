# Internal Redis for Celery/broker. С 17.09.2026 публикуется на адрес REDIS_BIND
# (tailnet-адрес прода): воркеры домашнего сервера берут задачи из этого же
# брокера. В интернет порт по-прежнему не выставлен.
bind 0.0.0.0
# Пароля нет намеренно: слушаем docker-сеть и tailnet, куда попадают только свои
# устройства. Если брокер окажется на публичном адресе — сначала requirepass,
# потом публикация. protected-mode yes ломает доступ из соседних контейнеров.
protected-mode no
port 6379

# Block common Redis takeover commands (SLAVEOF/REPLICAOF attacks).
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""

appendonly yes
