# Internal Redis for Celery/broker — not published to the host (see docker-compose.prod.yml).
bind 0.0.0.0
# Safe with Docker network only (no public :6379). protected-mode yes blocks other containers.
protected-mode no
port 6379

# Block common Redis takeover commands (SLAVEOF/REPLICAOF attacks).
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""

appendonly yes
