# Боевой стек на домашнем сервере saturday-run.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.home-site.yml \
#     --profile telegram up -d
#
# Отличия от VPS и почему они такие:
#   * база и redis — контейнерами. На VPS Postgres жил на хосте (так исторически
#     сложилось), здесь ставить его в систему незачем: том переживает
#     пересоздание, настройки видны в этом файле, а root не нужен вовсе.
#   * tg-proxy ОСТАЁТСЯ. 17.09.2026 я сгоряча решил, что дома Telegram открыт
#     напрямую, — замер был сделан из шелла с HTTPS_PROXY на VPN-выход и
#     ничего не доказывал. Из контейнера api.telegram.org недоступен так же,
#     как с прода: «Network is unreachable». Конфиг прокси (deploy/tg-proxy/
#     config.json) в git не хранится и едет рядом с .env.
#   * добавлен `edge` — TLS и домены (см. deploy/nginx/home/edge.conf).
#   * воркеры 5 вёрст, s95 и RunPark уже живут здесь с 17.09.2026
#     (docker-compose.home.yml), после переезда базы они переезжают в этот файл
#     и ходят к ней по локальной docker-сети, без tailnet.

# Логи контейнеров — в journald, а не в json-файлы Docker: json-лог удаляется
# вместе с контейнером, а каждый выкат пересоздаёт его (up -d --build). Так
# 13.10.2026 разбирать пропавшие прогоны было не по чему — логи начинались с
# последнего деплоя. Журнал переживает пересоздание; читать —
# `docker compose logs <сервис>` (пока контейнер жив) или
# `journalctl -t <имя контейнера> --since …` (и после). Объём ничтожный:
# воркеры сбора пишут ~250 КБ в сутки на всех, потолок журнала — 4 ГБ.
x-journald: &journald
  driver: journald
  options:
    tag: "{{.Name}}"

x-home-env: &home-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saturday_runs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saturday_runs_lk}
  REDIS_URL: redis://redis:6379/0
  # parkrun с домашнего адреса не трогаем вовсе: он общий со всем домом, и его
  # бан аукнулся бы всему, что отсюда ходит наружу (scripts/home_queue_run.sh
  # по той же причине не стартует без VPN-выходов). Серверный путь сайта —
  # «Обновить» parkrun и разбор очереди в :07/:37 — ходит браузером без прокси,
  # поэтому дома он выключен: заявки уходят в очередь профилей, её разбирает
  # pm-site-queue через VPN-выходы. Проверено 25.09.2026: на VPS этот путь
  # ходил в parkrun с адреса датацентра и ловил капчу.
  PARKRUN_SERVER_FETCH_ENABLED: "false"
  PARKRUN_SERVER_QUEUE_ENABLED: "false"
  # Ежедневная сверка каталога (parkrun_catalog.sync, 09:20) без прокси при
  # выключенном прямом доступе падает сразу. tg-proxy выводит весь трафик через
  # зарубежные выходы, не с домашнего адреса: events.json через неё скачан
  # 21.10.2026 — 940 КБ, 3002 площадки. Один запрос в сутки.
  PARKRUN_CATALOG_PROXY_URL: ${PARKRUN_CATALOG_PROXY_URL:-http://tg-proxy:8118}
  # Прогноз погоды (api.open-meteo.com) с домашнего адреса не отвечает совсем —
  # пакеты глушатся у провайдера; архив archive-api отвечает. Через tg-proxy
  # прогноз отдан за 0,2 с (21.10.2026); код пускает через неё только прогноз.
  WEATHER_PROXY_URL: ${WEATHER_PROXY_URL:-http://tg-proxy:8118}
  # Как у воркеров сбора в docker-compose.home.yml: иначе контейнеры root-ом
  # пишут __pycache__ в примонтированный backend/ клона.
  PYTHONDONTWRITEBYTECODE: "1"

services:
  postgres:
    # Debian, а не alpine из базового файла: на musl en_US.utf8 сортирует по
    # кодам символов, и списки по имени разъехались бы с продом (en_US.UTF-8 на
    # glibc) — «Ёлкин» в начало, имена с маленькой буквы в конец. Проверено
    # 20.10.2026 на обоих образах. Менять можно только до первого initdb тома:
    # правила сортировки база запоминает при создании.
    image: postgres:16
    environment:
      # Контрольные суммы страниц: память дома без ECC, и тихую порчу страницы
      # база заметит при чтении, а не через месяц. Действуют только при initdb.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Домашние 26.8 ГиБ против 7.8 на VPS: shared_buffers вчетверо больше
    # (на проде 512 МБ), maintenance_work_mem — чтобы восстановление дампа и
    # автовакуум по таблице в 2.3 млн строк не ползли.
    # Остальное — как в postgresql.conf прода (сверено 21.10.2026, дампом эти
    # настройки не переезжают): часовой пояс Москвы — иначе контейнер живёт в
    # UTC, и date_trunc по дням в админке, CURRENT_DATE в рейтингах и .date()
    # в коде съехали бы на 3 часа; запасной таймаут «idle in transaction» для
    # клиентов без своего (очередь профилей его отключает, приложение ставит
    # 60 с само); журнал запросов дольше 2 с; pg_stat_statements — расширение
    # приезжает с дампом, но без загрузки его представление не работает.
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c effective_cache_size=12GB
      -c max_connections=200
      -c random_page_cost=1.1
      -c timezone=Europe/Moscow
      -c log_timezone=Europe/Moscow
      -c idle_in_transaction_session_timeout=15min
      -c log_min_duration_statement=2000
      -c shared_preload_libraries=pg_stat_statements
    ports: !override
      - "127.0.0.1:5433:5432"
    volumes:
      - home_pgdata:/var/lib/postgresql/data
      # Каталог с дампами для переезда и восстановления (см. scripts/cutover_to_home.sh).
      - ${HOME_DUMP_DIR:-/home/dmitry/srs-prod-db}:/dump
    shm_size: "1g"
    logging: *journald

  redis:
    ports: !override []
    logging: *journald

  api:
    environment:
      <<: *home-env
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-180s}
    # 12 потоков против 4 на VPS — держим вчетверо больше рабочих процессов.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports: !override []
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./.env:/app/.env:ro
    logging: *journald

  nginx:
    # Наружу не смотрит: перед ним стоит edge с сертификатами.
    ports: !override []
    logging: *journald

  edge:
    image: nginx:1.27-alpine
    # nginx читает сертификат только при старте и reload, а certbot ниже кладёт
    # продлённый файл молча. Без перечитывания край отдавал бы старый
    # сертификат до его истечения (у run5k.run — 08.01.2027), и сайт открылся бы
    # у всех с ошибкой, а HSTS не дал бы её обойти. Раз в 6 часов — reload,
    # новые соединения получают свежий сертификат, живые не рвутся.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    # EDGE_BIND=127.0.0.1 — репетиция: стек поднят целиком, но снаружи его нет.
    # Боевое значение (0.0.0.0) ставится только в момент переключения.
    ports:
      - "${EDGE_BIND:-0.0.0.0}:80:80"
      - "${EDGE_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/nginx/home/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx:/maintenance:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
      - ./deploy/nginx/home/grafana-farewell:/var/www/grafana-farewell:ro
    depends_on:
      - nginx
    restart: unless-stopped
    logging: *journald

  # Продление сертификатов: раз в сутки пробуем. Край подхватывает новый файл
  # своим reload раз в 6 часов (см. edge.command). Ходит через тот же
  # /.well-known, что отдаёт edge, — поэтому все имена сертификатов (run5k.run,
  # www, app, grafana) обязаны смотреть в DNS сюда, иначе продление упадёт; www
  # Timeweb повторяет за run5k.run сам.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 24h; done"
    restart: unless-stopped
    logging: *journald

  worker:
    environment: *home-env
    logging: *journald
  worker-warm:
    environment: *home-env
    logging: *journald
  worker-s95:
    environment: *home-env
    logging: *journald
  worker-five-verst:
    environment: *home-env
    logging: *journald
  # Свежесть 5 вёрст отдельным воркером: приоритет очередей внутри одного
  # воркера оказался случайным (разобрано другой сессией 20.09.2026).
  worker-five-verst-fresh:
    environment: *home-env
    logging: *journald
  worker-five-verst-user:
    environment: *home-env
    logging: *journald
  worker-parkrun:
    environment: *home-env
    logging: *journald
  worker-runpark:
    environment: *home-env
    logging: *journald
  beat:
    environment: *home-env
    logging: *journald

  bot:
    environment:
      API_BASE_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL}
      PYTHONDONTWRITEBYTECODE: "1"
    logging: *journald

  tg-proxy:
    logging: *journald

volumes:
  home_pgdata:
  certbot_webroot:
