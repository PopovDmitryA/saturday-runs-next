<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Дефолт на случай, если по маршруту мета-тегов не нашлось; на всех
         известных страницах их перетирает setPageMeta (src/lib/pageMeta.ts),
         а роботам отдаёт готовыми серверный пререндер (backend/app/seo). -->
    <meta name="description" content="Единая статистика субботних парковых пробежек: 5 вёрст, S95, parkrun и RunPark в одном месте. Рекорды и рейтинги участников, страницы локаций, личный кабинет с историей стартов и волонтёрства." />
    <title>run5k.run — статистика субботних пробежек</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Тема выставляется до первой отрисовки, чтобы не мигала светлая.
      // Цвета theme-color дублируются в src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#1a2332" : "#ffffff");
        } catch (e) {
          /* без localStorage останется светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
