    <script>
      // Тема выставляется до первой отрисовки, чтобы не мигала светлая.
      // Цвета theme-color дублируются в src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored

                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#1a2332" : "#ffffff");
        } catch (e) {
          /* без localStorage останется светлая тема */
        }
      })();
    </script>
