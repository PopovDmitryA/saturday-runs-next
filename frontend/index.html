<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Единая статистика субботних парковых пробежек из 5 вёрст, С95 и parkrun — личный кабинет участника." />
    <title>Статистика парковых пробежек</title>
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Тема выставляется до первой отрисовки, чтобы не мигала светлая.
      // Цвета theme-color дублируются в src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#1a2332" : "#ffffff");
        } catch (e) {
          /* без localStorage останется светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
